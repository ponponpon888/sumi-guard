# Windows PowerShell 5.1 checks for SUMI Guard.
#
# What this workflow establishes: the repository's PowerShell files parse under
# Windows PowerShell 5.1, carry the UTF-8 BOM that 5.1 needs for non-ASCII
# text, pass PSScriptAnalyzer at Error severity, and that the test scripts
# using only synthetic input pass on a clean Windows host. The separate
# managed-process real-child jobs exercise only fixed harmless child processes.
#
# What it does not establish: DPAPI CurrentUser protection,
# independent OS process observation, DIRECT_MATCH, arbitrary command safety,
# real kill failures, unconfirmed termination, post-exit identity revalidation,
# or behaviour on an operator machine. The DPAPI-dependent tests are excluded with their reasons
# in .github/scripts/Invoke-SumiGuardCiTestSuite.ps1. A green run is not a
# measurement record; see docs/25-ci-windows-powershell-check.md.
name: windows-powershell-5.1-check

on:
  push:
    # Feature branches run CI via pull_request, avoiding a duplicate push run.
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-encoding:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report host PowerShell version
        shell: powershell
        run: $PSVersionTable | Format-List | Out-String | Write-Host
      - name: Parse every PowerShell file without executing it
        shell: powershell
        run: .\.github\scripts\Invoke-SumiGuardSyntaxCheck.ps1

  script-analyzer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run PSScriptAnalyzer, failing on Error severity only
        shell: powershell
        run: .\.github\scripts\Invoke-SumiGuardAnalyzerCheck.ps1 -FailOnSeverity Error

  dpapi-independent-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run the test scripts that do not depend on DPAPI CurrentUser
        shell: powershell
        run: .\.github\scripts\Invoke-SumiGuardCiTestSuite.ps1

  managed-process-real-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify one fixed harmless child, separately from synthetic suite
        shell: powershell
        run: .\tests\Invoke-ManagedProcessEvidenceRealSmokeTests.ps1 -RunSmoke

  managed-process-failure-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify fixed nonzero-exit and timeout children, separately from synthetic suite
        shell: powershell
        run: .\tests\Invoke-ManagedProcessEvidenceFailureSmokeTests.ps1 -RunSmoke
